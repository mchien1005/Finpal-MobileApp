spring.application.name=backend

# MySQL Configuration for FinPal
spring.datasource.url=jdbc:mysql://localhost:3306/finpal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=604800000

# Jackson Configuration
spring.jackson.mapper.accept-case-insensitive-properties=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# AI Backend Configuration
ai.backend.url=http://175.41.150.228:8000
ai.backend.enabled=true
ai.confidence.threshold=0.70

# Categorization Strategy:
# - AI_FIRST: Ưu tiên AI, nếu confidence thấp thì dùng rule
# - RULE_FIRST: Ưu tiên rule-based, nếu không match thì dùng AI (mặc định)
# - HYBRID: Dùng cả AI và rule, chọn kết quả có confidence cao hơn
# - RULE_ONLY: Chỉ dùng rule-based, không call AI
ai.categorization.strategy=AI_FIRST

# ============================================
# Security - Login Protection Configuration
# ============================================
# Số lần đăng nhập thất bại tối đa trước khi bị khóa tạm thời
security.login.max-failed-attempts=5
# Thời gian khóa tạm thời (phút) sau khi vượt quá số lần thất bại
security.login.lockout-duration-minutes=10

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=false

# Scheduler Configuration
spring.task.scheduling.pool.size=5



# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# PDF Export Configuration
pdf.export.temp.directory=${PDF_EXPORT_TEMP_DIRECTORY:/tmp/finpal-exports}
pdf.export.retention.days=${PDF_EXPORT_RETENTION_DAYS:7}

# Database Backup Configuration
backup.directory=${BACKUP_DIRECTORY:/tmp/finpal-backups}
backup.retention.days=${BACKUP_RETENTION_DAYS:30}
backup.max.count=${BACKUP_MAX_COUNT:50}
backup.scheduled.enabled=${BACKUP_SCHEDULED_ENABLED:true}
backup.scheduled.cron=${BACKUP_SCHEDULED_CRON:0 0 2 * * *}
backup.cleanup.cron=${BACKUP_CLEANUP_CRON:0 0 3 * * SUN}

# ============================================
# FCM Push Notification Configuration
# ============================================
# Bật/tắt FCM push notifications
fcm.enabled=${FCM_ENABLED:true}
# Đường dẫn file service account Firebase (trong resources hoặc filesystem)
fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:finpal-5ee31-firebase-adminsdk-fbsvc-4cf56d6b3e.json}

# ============================================
# Smart Notification Scheduler Configuration
# ============================================
# Bật/tắt hệ thống thông báo chủ động thông minh
scheduler.smart-notifications.enabled=true


# Cảnh báo ngân sách - Chạy mỗi 2 giờ (0:00, 2:00, 4:00...)
scheduler.smart-notifications.budget-alerts.cron=0 0 */2 * * *

# Gợi ý tiết kiệm - Chạy lúc 9:30 AM CHỦ nhật
scheduler.smart-notifications.savings-suggestions.cron=0 30 9 * * SUN

# Phát hiện bất thường - Chạy mỗi ngày lúc 7:00 PM
scheduler.smart-notifications.anomaly-detection.cron=0 0 19 * * *

# Nhắc mục tiêu - Chạy mỗi ngày lúc 10:00 AM
scheduler.smart-notifications.goal-reminders.cron=0 0 10 * * *

# Kiểm tra hoàn thành mục tiêu - Chạy mỗi giờ
scheduler.smart-notifications.goal-completions.cron=0 0 * * * *

# Phân tích chi tiêu - Chạy mỗi ngày lúc 7:00 PM
scheduler.smart-notifications.spending-insights.cron=0 0 19 * * *

# Tổng kết tháng - Chạy ngày 1 hàng tháng lúc 9:15 AM
scheduler.smart-notifications.monthly-summary.cron=0 15 9 1 * *

# Tổng kết tuần - Chạy Chủ nhật lúc 9:15 AM
scheduler.smart-notifications.weekly-summary.cron=0 15 9 * * SUN

# Smart Tips từ BackendAI - Chạy mỗi ngày lúc 9:20 AM
scheduler.smart-notifications.smart-tips.cron=0 20 9 * * *
# Số lượng tips tối đa lấy từ AI
scheduler.smart-notifications.smart-tips.max-tips=10
# Khoảng cách giữa các tips (phút) - VD: 30 phút = gửi tip 1 lúc 9h20, tip 2 lúc 9h50, tip 3 lúc 10h20...
scheduler.smart-notifications.smart-tips.interval-minutes=60
