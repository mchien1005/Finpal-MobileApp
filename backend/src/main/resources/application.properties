spring.application.name=backend

# MySQL Configuration for FinPal
spring.datasource.url=jdbc:mysql://localhost:3306/finpal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=604800000

# Jackson Configuration
spring.jackson.mapper.accept-case-insensitive-properties=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# AI Backend Configuration
ai.backend.url=http://175.41.150.228:8000
ai.backend.enabled=true
ai.confidence.threshold=0.70

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=false

# Scheduler Configuration
spring.task.scheduling.pool.size=5
scheduler.notifications.enabled=true
scheduler.notifications.budget-alerts.cron=0 0 8 * * *
scheduler.notifications.savings-suggestions.cron=0 0 9 * * SUN
scheduler.notifications.spending-insights.cron=0 0 19 * * *
scheduler.notifications.cleanup.cron=0 0 2 * * *
